<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>宝贝点菜 · 孕期营养点餐</title>
<style>
:root{
  --bg:#F5F6F8; --surface:#fff; --line:#ECEDF0; --ink:#1F2329; --ink-2:#6B7280; --ink-3:#9CA3AF;
  --primary:#FF5F1F; --primary-soft:#FFF0E8; --primary-deep:#E84E0E;
  --green:#16A34A; --green-soft:#E8F7EE; --gold:#D97706; --gold-soft:#FEF3E2;
  --red:#DC2626; --red-soft:#FEE2E2;
  --shadow:0 2px 12px rgba(31,35,41,.08); --shadow-lg:0 8px 40px rgba(31,35,41,.16);
  --r:12px; --r-lg:20px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --nav-w:92px; --cart-h:60px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Noto Sans SC',sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#app{height:100%;max-width:480px;margin:0 auto;position:relative;background:var(--bg);display:flex;flex-direction:column}

/* ===== 顶部栏 ===== */
.topbar{
  position:sticky;top:0;z-index:30;background:var(--surface);
  padding:8px 14px;border-bottom:1px solid var(--line);
}
.topbar .row1{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#FF7A45,#FF5F1F);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 6px rgba(255,95,31,.3)}
.logo span{color:#fff;font-size:18px;font-weight:800}
.title-zone{flex:1;min-width:0}
.title-zone .t1{font-size:17px;font-weight:700;letter-spacing:.3px}
.title-zone .t2{font-size:11px;color:var(--ink-3);margin-top:1px}
.week-pill{background:var(--primary-soft);border:1px solid #FFE0CF;color:var(--primary-deep);font-size:11px;font-weight:700;border-radius:20px;padding:4px 10px;white-space:nowrap}
.search-box{
  margin-top:8px;display:flex;align-items:center;gap:6px;
  background:var(--bg);border-radius:10px;padding:7px 10px;border:1px solid transparent;
}
.search-box:focus-within{border-color:var(--primary)}
.search-box input{flex:1;border:none;outline:none;background:transparent;font-size:13px;color:var(--ink)}
.search-box input::placeholder{color:var(--ink-3)}
.search-ico{font-size:14px;color:var(--ink-3)}

/* ===== 主区：左导航+右列表 ===== */
.main{flex:1;display:flex;overflow:hidden;position:relative}
.cuisine-nav{
  width:var(--nav-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);
  overflow-y:auto;overflow-x:hidden;padding-bottom:var(--cart-h);
}
.cuisine-nav::-webkit-scrollbar{display:none}
.nav-item{
  padding:12px 6px;text-align:center;font-size:12px;color:var(--ink-2);
  cursor:pointer;position:relative;transition:all .15s;line-height:1.3;
}
.nav-item .nav-ico{font-size:17px;display:block;margin-bottom:3px}
.nav-item.active{background:var(--bg);color:var(--ink);font-weight:700}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--primary);border-radius:0 3px 3px 0}
.nav-item .cnt{display:inline-block;min-width:16px;height:16px;line-height:16px;border-radius:8px;background:var(--primary);color:#fff;font-size:10px;padding:0 4px;margin-left:2px;font-weight:600}

.dish-list{flex:1;overflow-y:auto;background:var(--bg);padding-bottom:var(--cart-h);-webkit-overflow-scrolling:touch}
.dish-list::-webkit-scrollbar{display:none}
.group-title{
  padding:10px 14px 6px;font-size:14px;font-weight:700;color:var(--ink);
  display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:5;background:var(--bg);
}
.group-title .g-tag{font-size:10px;color:var(--ink-3);font-weight:400}
.dish-item{
  display:flex;gap:10px;padding:12px 14px;background:var(--surface);margin-bottom:8px;margin-left:8px;margin-right:8px;
  border-radius:var(--r);box-shadow:var(--shadow);position:relative;cursor:pointer;
}
.dish-item:active{background:#FAFBFC}
.dish-img{
  width:84px;height:84px;border-radius:10px;flex-shrink:0;object-fit:cover;background:#F0F1F3;
  border:1px solid var(--line);
}
.dish-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.dish-name{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dish-meta{font-size:10.5px;color:var(--ink-3);margin-top:2px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.dish-meta .tag-chip{background:var(--green-soft);color:var(--green);border-radius:4px;padding:1px 5px;font-weight:600}
.dish-meta .tag-chip.early{background:var(--gold-soft);color:var(--gold)}
.dish-meta .tag-chip.warn{background:var(--red-soft);color:var(--red)}
.dish-sales{font-size:10.5px;color:var(--ink-3);margin-top:1px}
.dish-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.dish-price{color:var(--primary);font-weight:800;font-size:16px}
.dish-price small{font-size:11px;font-weight:600}
.add-btn{
  width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;border:none;
  font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 2px 6px rgba(255,95,31,.4);transition:transform .1s;flex-shrink:0;
}
.add-btn:active{transform:scale(.88)}
.add-btn.added{background:var(--green);box-shadow:0 2px 6px rgba(22,163,74,.4)}


/* ===== 底部购物车栏 ===== */
.cart-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  z-index:40;padding:0 12px calc(var(--safe-bottom) + 10px);pointer-events:none;
}
.cart-inner{
  pointer-events:auto;background:var(--ink);border-radius:var(--r-lg);color:#fff;
  display:flex;align-items:center;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.25);gap:10px;
}
.cart-ico-wrap{position:relative}
.cart-ico{
  width:44px;height:44px;border-radius:50%;background:#3A3F47;display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;border:4px solid var(--ink);
}
.cart-ico.has-items{background:var(--primary)}
.cart-badge{
  position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:10px;font-weight:700;
  min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;
  border:2px solid var(--ink);
}
.cart-badge.show{display:flex}
.cart-total{flex:1;min-width:0}
.cart-total .amt{font-size:18px;font-weight:800}
.cart-total .amt small{font-size:12px;font-weight:600;color:#C8CDD4}
.cart-total .desc{font-size:10px;color:#9BA1AA;margin-top:1px}
.cart-total .desc .free{color:#FFD166;font-weight:600}
.cart-submit{
  background:var(--primary);color:#fff;border:none;border-radius:20px;padding:11px 22px;
  font-size:14px;font-weight:700;cursor:pointer;flex-shrink:0;letter-spacing:1px;
}
.cart-submit.disabled{background:#5B626B;cursor:not-allowed}
.cart-submit.enough{background:linear-gradient(90deg,#FF7A45,#FF5F1F)}

/* ===== 底部tab ===== */
.tab-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:var(--surface);border-top:1px solid var(--line);z-index:45;
  display:flex;padding-bottom:var(--safe-bottom);height:calc(52px + var(--safe-bottom));
}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink-3);font-size:10px;cursor:pointer;gap:2px}
.tab-item .tab-ico{font-size:19px;line-height:1}
.tab-item.active{color:var(--primary);font-weight:600}

/* ===== 详情弹层 ===== */
.sheet-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;
}
.sheet-mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);
  width:100%;max-width:480px;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;
  z-index:51;transition:transform .28s cubic-bezier(.22,.9,.35,1);max-height:88%;display:flex;flex-direction:column;
  padding-bottom:var(--safe-bottom);
}
.sheet.show{transform:translateX(-50%) translateY(0)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:#E2E4E8;margin:8px auto 0}
.sheet-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 16px}
.sheet-hero{width:100%;height:220px;object-fit:cover;border-radius:var(--r);background:#F0F1F3;margin-bottom:12px}
.sheet-title{font-size:19px;font-weight:800;line-height:1.3}
.sheet-sub{font-size:12px;color:var(--ink-2);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sheet-sub .cuisine-chip{background:var(--primary-soft);color:var(--primary-deep);border-radius:4px;padding:2px 6px;font-weight:600}
.sheet-sub .cat-chip{background:var(--bg);color:var(--ink-2);border-radius:4px;padding:2px 6px}
.sheet-price-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.sheet-price{color:var(--primary);font-size:22px;font-weight:800}
.sheet-sales{font-size:11px;color:var(--ink-3);margin-top:2px}
.sheet-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sheet-tags .st{background:var(--green-soft);color:var(--green);border-radius:5px;padding:3px 8px;font-size:11px;font-weight:600}
.sheet-tags .st.early{background:var(--gold-soft);color:var(--gold)}
.sheet-tags .st.warn{background:var(--red-soft);color:var(--red)}
.sheet-tags .st.late{background:#EDE9FE;color:#7C3AED}
.sheet-sec{margin-top:14px}
.sheet-sec h4{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.sheet-sec h4::before{content:'';width:3px;height:13px;background:var(--primary);border-radius:2px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-grid .ig{background:var(--bg);border-radius:8px;padding:8px 10px}
.info-grid .ig .k{font-size:10px;color:var(--ink-3)}
.info-grid .ig .v{font-size:12px;font-weight:600;color:var(--ink);margin-top:2px}
.ai-box{
  background:linear-gradient(135deg,#FFF7F0,#FFF0E8);border:1px solid #FFE3D1;border-radius:10px;padding:10px 12px;
  font-size:12.5px;color:#6B4A33;line-height:1.6;
}
.ai-box .ai-tag{display:inline-block;background:var(--primary);color:#fff;font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;margin-bottom:4px}
.nutri-row{display:flex;flex-wrap:wrap;gap:6px}
.nutri-row .nt{background:var(--green-soft);color:var(--green);font-size:11px;font-weight:600;border-radius:12px;padding:3px 10px}
.sheet-tips{font-size:12px;color:var(--ink-2);line-height:1.65;background:var(--bg);border-radius:8px;padding:8px 10px}
.sheet-foot{
  padding:10px 16px calc(10px + var(--safe-bottom));border-top:1px solid var(--line);
  display:flex;align-items:center;gap:12px;background:var(--surface);
}
.stepper{display:flex;align-items:center;gap:0;flex-shrink:0}
.stepper .sb{width:32px;height:32px;border-radius:50%;border:1px solid var(--primary);background:#fff;color:var(--primary);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.stepper .sb.minus{color:var(--ink-3);border-color:var(--line)}
.stepper .num{min-width:36px;text-align:center;font-size:16px;font-weight:700}
.sheet-add{flex:1;background:linear-gradient(90deg,#FF7A45,#FF5F1F);color:#fff;border:none;border-radius:22px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:1px}

/* ===== 购物车页 ===== */
.cart-page{
  position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;
  max-width:480px;margin:0 auto;
}
.cart-page.show{display:flex}
.cart-head{padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.cart-head .back{font-size:22px;cursor:pointer;color:var(--ink)}
.cart-head h2{font-size:16px;font-weight:700;flex:1}
.cart-head .clear{font-size:12px;color:var(--ink-3);cursor:pointer}
.cart-items{flex:1;overflow-y:auto;padding:12px 16px 80px;-webkit-overflow-scrolling:touch}
.cart-item{display:flex;gap:10px;background:var(--surface);border-radius:var(--r);padding:10px;margin-bottom:8px;box-shadow:var(--shadow);align-items:center}
.cart-item .ci-img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex-shrink:0}
.cart-item .ci-info{flex:1;min-width:0}
.cart-item .ci-name{font-size:13px;font-weight:600}
.cart-item .ci-meta{font-size:10.5px;color:var(--ink-3);margin-top:2px}
.cart-item .ci-price{font-size:14px;font-weight:700;color:var(--primary);margin-top:2px}
.cart-foot{
  position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + var(--safe-bottom));display:flex;align-items:center;gap:12px;
}
.cart-foot .cf-total{flex:1;font-size:13px;color:var(--ink-2)}
.cart-foot .cf-total b{color:var(--primary);font-size:19px}
.cart-foot .cf-submit{background:linear-gradient(90deg,#FF7A45,#FF5F1F);color:#fff;border:none;border-radius:22px;padding:11px 26px;font-size:14px;font-weight:700;cursor:pointer}

/* ===== 下单成功页 ===== */
.order-done{
  position:fixed;inset:0;z-index:70;background:var(--surface);display:none;flex-direction:column;align-items:center;justify-content:center;
  max-width:480px;margin:0 auto;text-align:center;padding:40px;
}
.order-done.show{display:flex}
.order-done .ok-ico{width:76px;height:76px;border-radius:50%;background:var(--green-soft);color:var(--green);font-size:40px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.order-done h2{font-size:20px;font-weight:800;margin-bottom:8px}
.order-done p{font-size:13px;color:var(--ink-2);line-height:1.7;margin-bottom:6px}
.order-done .od-list{background:var(--bg);border-radius:10px;padding:12px 16px;margin:12px 0;width:100%;font-size:12.5px;color:var(--ink);text-align:left}
.order-done .od-list .li{display:flex;justify-content:space-between;padding:3px 0}
.order-done .back-btn{margin-top:14px;background:var(--primary);color:#fff;border:none;border-radius:22px;padding:12px 40px;font-size:14px;font-weight:700;cursor:pointer}

/* ===== 引导浮层 ===== */
.tutorial{
  position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;
  max-width:480px;margin:0 auto;
}
.tutorial.show{display:flex}
.tutorial .card{background:var(--surface);border-radius:var(--r-lg);padding:24px;width:86%;text-align:center}
.tutorial h3{font-size:16px;font-weight:700;margin-bottom:8px}
.tutorial p{font-size:12.5px;color:var(--ink-2);line-height:1.7;margin-bottom:12px}
.tutorial .t-ico{font-size:44px;margin-bottom:10px}
.tutorial .t-btn{background:var(--primary);color:#fff;border:none;border-radius:20px;padding:10px 34px;font-size:13px;font-weight:700;cursor:pointer}

/* ===== 孕周设置弹层 ===== */
.week-sheet .sheet-scroll{padding-top:6px}
.week-opt{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.week-opt select{font-size:13px;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.week-save{width:100%;background:var(--primary);color:#fff;border:none;border-radius:22px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px}

.toast{
  position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:90;
  background:rgba(31,35,41,.9);color:#fff;font-size:12.5px;border-radius:20px;padding:8px 18px;
  opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:80%;
}
.toast.show{opacity:1}
</style>

</head>
<body>
<div id="app">

  <!-- 顶部栏 -->
  <div class="topbar">
    <div class="row1">
      <div class="logo"><span>孕</span></div>
      <div class="title-zone">
        <div class="t1">宝贝点菜</div>
        <div class="t2">孕期营养 · 每道菜都懂你</div>
      </div>
      <div class="week-pill" id="weekPill">孕早期</div>
    </div>
    <div class="search-box">
      <span class="search-ico">🔍</span>
      <input id="searchInput" type="text" placeholder="搜索菜名 / 想吃的食材" />
    </div>
  </div>

  <!-- 主区 -->
  <div class="main">
    <!-- 左侧分类导航 -->
    <div class="cuisine-nav" id="cuisineNav"></div>
    <!-- 右侧菜品列表 -->
    <div class="dish-list" id="dishList"></div>
  </div>

  <!-- 底部Tab -->
  <div class="tab-bar" id="tabBar">
    <div class="tab-item active" data-tab="menu"><span class="tab-ico">🍽️</span>点菜</div>
    <div class="tab-item" data-tab="guide"><span class="tab-ico">📖</span>孕期指南</div>
    <div class="tab-item" data-tab="orders"><span class="tab-ico">📋</span>我的订单</div>
  </div>

  <!-- 底部购物车栏 -->
  <div class="cart-bar" id="cartBar">
    <div class="cart-inner">
      <div class="cart-ico-wrap">
        <div class="cart-ico" id="cartIco">🛒</div>
        <div class="cart-badge" id="cartBadge">0</div>
      </div>
      <div class="cart-total">
        <div class="amt"><small>¥</small><span id="cartAmt">0</span></div>
        <div class="desc" id="cartDesc">满 ¥20 起送</div>
      </div>
      <button class="cart-submit disabled" id="cartSubmit">去下单</button>
    </div>
  </div>

  <!-- 详情弹层 -->
  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-scroll" id="sheetScroll"></div>
    <div class="sheet-foot">
      <div class="stepper">
        <button class="sb minus" id="sbMinus">−</button>
        <span class="num" id="sbNum">0</span>
        <button class="sb plus" id="sbPlus">＋</button>
      </div>
      <button class="sheet-add" id="sheetAdd">加入购物车</button>
    </div>
  </div>

  <!-- 购物车页 -->
  <div class="cart-page" id="cartPage">
    <div class="cart-head">
      <span class="back" id="cartBack">←</span>
      <h2>购物车</h2>
      <span class="clear" id="cartClear">清空</span>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot">
      <div class="cf-total">合计 <b>¥<span id="cfAmt">0</span></b></div>
      <button class="cf-submit" id="cfSubmit">提交订单</button>
    </div>
  </div>

  <!-- 下单成功 -->
  <div class="order-done" id="orderDone">
    <div class="ok-ico">✓</div>
    <h2>下单成功！</h2>
    <p>已通知家人接收订单，安心等待投喂 💕</p>
    <div class="od-list" id="odList"></div>
    <button class="back-btn" id="odBack">返回继续点菜</button>
  </div>

  <!-- 引导浮层 -->
  <div class="tutorial" id="tutorial">
    <div class="card">
      <div class="t-ico">👶</div>
      <h3>欢迎来到宝贝点菜</h3>
      <p>601道孕期适配菜谱，覆盖粤菜、家常菜等八大菜系<br/>点菜会实时通知家人，安心等投喂～</p>
      <button class="t-btn" id="tutBtn">开始点菜</button>
    </div>
  </div>

  <!-- 孕周设置 -->
  <div class="sheet-mask" id="weekMask"></div>
  <div class="sheet week-sheet" id="weekSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-scroll">
      <div class="week-opt">
        <span>当前孕周</span>
        <select id="weekSelect"></select>
      </div>
      <div class="week-opt">
        <span>孕期阶段</span>
        <select id="stageSelect">
          <option value="auto">自动按孕周</option>
          <option value="early">孕早期（≤12周）</option>
          <option value="mid">孕中期（13-27周）</option>
          <option value="late">孕晚期（28周+）</option>
        </select>
      </div>
      <button class="week-save" id="weekSave">保存</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="dishes.js"></script>
<script>

'use strict';
/* ================= 常量与状态 ================= */
const WEBHOOK_URL = 'https://open.feishu.cn/open-apis/bot/v2/hook/11b72e87-5e38-4c41-9e52-7fd16ff35eb5';
const CHAT_NAME = '宝贝计划·个人专属';
const MIN_ORDER = 20;           // 起送价
const DELIVERY_FEE = 0;         // 配送费

// 分类导航定义（外卖点餐模式）
const NAV = [
  {key:'hot',      name:'🔥 热销',    filter:null, sort:'sales'},
  {key:'signature',name:'🏅 招牌必点', filter:function(d){return d.tags.indexOf('招牌')>=0 || d.tags.indexOf('经典')>=0 || d.sales>800;}},
  {key:'soup',     name:'🥣 老火炖汤', filter:function(d){return d.category==='汤羹';}},
  {key:'meat',     name:'🍖 大厨鲜炒', filter:function(d){return d.category==='热菜·荤';}},
  {key:'veg',      name:'🥬 健康时蔬', filter:function(d){return d.category==='热菜·素';}},
  {key:'seafood',  name:'🦐 海鲜水产', filter:function(d){return d.category==='海鲜水产';}},
  {key:'staple',   name:'🍚 主食米饭', filter:function(d){return d.category==='粥粉面饭';}},
  {key:'dimsum',   name:'🥟 粤式点心', filter:function(d){return d.category==='粤式点心';}},
  {key:'drink',    name:'🍹 饮品甜品', filter:function(d){return d.category==='饮品甜品';}},
  {key:'cold',     name:'🥗 凉菜卤味', filter:function(d){return d.category==='凉菜卤味';}},
];

// 孕期阶段映射
const STAGE_NAME = {early:'孕早期', mid:'孕中期', late:'孕晚期'};
const STAGE_RANGE = {early:'≤12周', mid:'13-27周', late:'28周+'};
const STAGE_ALL = ['early','mid','late'];

let DISHES = (window.DISHES || []).map(function(d){
  d.q = (d.name + d.tags.join('') + d.nutrition.join('') + d.ingredients + d.cuisine + d.category).toLowerCase();
  return d;
});

let state = {
  cart: {},            // id -> qty
  activeNav: 'hot',
  activeDish: null,    // 详情弹层当前菜品
  week: 5,             // 默认孕5周
  stageMode: 'auto',   // auto | early | mid | late
  orders: JSON.parse(localStorage.getItem('bbdc_orders')||'[]'),
};

/* ================= 工具函数 ================= */
const $ = function(id){return document.getElementById(id);};
function fmtPrice(p){return String(p);}
function stageOfWeek(w){
  if(w <= 12) return 'early';
  if(w <= 27) return 'mid';
  return 'late';
}
function currentStage(){
  if(state.stageMode !== 'auto') return state.stageMode;
  return stageOfWeek(state.week);
}
function stageText(s){
  if(s === 'early') return '孕早期适宜';
  if(s === 'mid') return '孕中期适宜';
  return '孕晚期适宜';
}
function dishInStage(d){
  var s = currentStage();
  return d.stages.indexOf(s) >= 0;
}
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(function(){t.classList.remove('show');}, 2000);
}
function cartCount(){
  return Object.keys(state.cart).reduce(function(s,k){return s + state.cart[k];}, 0);
}
function cartTotal(){
  return Object.keys(state.cart).reduce(function(s,k){
    var d = dishById(k); return s + (d ? d.price * state.cart[k] : 0);
  }, 0);
}
function dishById(id){
  for(var i=0;i<DISHES.length;i++){if(DISHES[i].id === id) return DISHES[i];}
  return null;
}
function saveOrders(){
  try{localStorage.setItem('bbdc_orders', JSON.stringify(state.orders));}catch(e){}
}


/* ================= 分类导航渲染 ================= */
function renderNav(){
  var nav = $('cuisineNav');
  var html = '';
  for(var i=0;i<NAV.length;i++){
    var n = NAV[i];
    var cnt = countInNav(n);
    html += '<div class="nav-item' + (state.activeNav===n.key?' active':'') + '" data-nav="' + n.key + '">' +
      '<span class="nav-ico"></span>' + n.name.replace(/^[^\s]+\s/,'') +
      (cnt>0?'<span class="cnt">'+(cnt>99?'99+':cnt)+'</span>':'') +
      '</div>';
  }
  nav.innerHTML = html;
}
function countInNav(n){
  if(n.key === 'hot') return 20;
  if(!n.filter) return 0;
  var c = 0;
  for(var i=0;i<DISHES.length;i++){
    var d = DISHES[i];
    if(dishInStage(d) && n.filter(d)) c++;
  }
  return c;
}
function dishesOfNav(n){
  var arr = [];
  for(var i=0;i<DISHES.length;i++){
    var d = DISHES[i];
    if(!dishInStage(d)) continue;
    if(n.filter && !n.filter(d)) continue;
    arr.push(d);
  }
  if(n.sort === 'sales'){
    arr.sort(function(a,b){return b.sales - a.sales;});
  }
  return arr.slice(0, n.key==='hot'?30:arr.length);
}

/* ================= 菜品列表渲染 ================= */
function renderList(){
  var n = null;
  for(var i=0;i<NAV.length;i++){if(NAV[i].key === state.activeNav) n = NAV[i];}
  if(!n) return;
  var arr = dishesOfNav(n);
  var list = $('dishList');
  var kw = ($('searchInput').value||'').trim().toLowerCase();
  if(kw){
    arr = DISHES.filter(function(d){
      return dishInStage(d) && d.q.indexOf(kw) >= 0;
    }).sort(function(a,b){return b.sales - a.sales;});
  }
  var html = '';
  var title = kw ? ('搜索「' + $('searchInput').value.trim() + '」') : n.name;
  var tip = '';
  if(!kw){
    var cs = currentStage();
    tip = '<span class="g-tag">当前·' + STAGE_NAME[cs] + ' ' + STAGE_RANGE[cs] + '</span>';
  }
  html += '<div class="group-title">' + title + tip + '</div>';
  if(!arr.length){
    html += '<div style="padding:40px 20px;text-align:center;color:var(--ink-3);font-size:13px;">没有找到符合当前孕期的菜品，试试其他分类～</div>';
  }
  for(var j=0;j<arr.length;j++){
    html += dishCard(arr[j]);
  }
  list.innerHTML = html;
}
function dishCard(d){
  var cs = currentStage();
  var stageTxt = STAGE_NAME[cs];
  var tagsHtml = '';
  var shown = 0;
  for(var i=0;i<d.tags.length && shown<2;i++){
    var t = d.tags[i];
    if(t === '粤味' || t === '清爽' || t === '补水' || t === '高纤维' || t === '微辣') continue;
    var cls = 'tag-chip';
    if(t.indexOf('孕早期')>=0) cls = 'tag-chip early';
    if(t.indexOf('孕晚期')>=0) cls = 'tag-chip';
    if(t.indexOf('慎')>=0 || t.indexOf('减辣')>=0 || t.indexOf('避免')>=0) cls = 'tag-chip warn';
    if(t === '补DHA' || t === '补铁' || t === '补蛋白') cls = 'tag-chip';
    tagsHtml += '<span class="' + cls + '">' + t + '</span>';
    shown++;
  }
  if(shown === 0){
    tagsHtml += '<span class="tag-chip">' + stageText(cs) + '</span>';
  }
  var qty = state.cart[d.id] || 0;
  var addCls = qty>0 ? 'add-btn added' : 'add-btn';
  var addTxt = qty>0 ? '✓' : '+';
  var priceWarn = (d.price < 8) ? '<small>起</small>' : '';
  return '<div class="dish-item" data-id="' + d.id + '">' +
    '<img class="dish-img" src="' + (d.img || '') + '" alt="' + d.name + '" loading="lazy" />' +
    '<div class="dish-info">' +
      '<div>' +
        '<div class="dish-name">' + d.name + '</div>' +
        '<div class="dish-meta">' + tagsHtml + '</div>' +
        '<div class="dish-sales">月售' + (d.sales>999?Math.round(d.sales/100)/10+'k':d.sales) + ' · ' + d.cuisine + '</div>' +
      '</div>' +
      '<div class="dish-bottom">' +
        '<div class="dish-price">¥' + fmtPrice(d.price) + priceWarn + '</div>' +
        '<button class="' + addCls + '" data-act="add" data-id="' + d.id + '">' + addTxt + '</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}


/* ================= 详情弹层 ================= */
function renderSheet(d){
  var s = $('sheetScroll');
  var tagsHtml = '';
  for(var i=0;i<d.tags.length;i++){
    var t = d.tags[i];
    var cls = 'st';
    if(t.indexOf('孕早期')>=0) cls = 'st early';
    if(t.indexOf('孕晚期')>=0) cls = 'st late';
    if(t.indexOf('慎')>=0 || t.indexOf('减辣')>=0 || t.indexOf('避免')>=0) cls = 'st warn';
    tagsHtml += '<span class="' + cls + '">' + t + '</span>';
  }
  var nutHtml = '';
  for(var j=0;j<d.nutrition.length;j++){
    nutHtml += '<span class="nt">' + d.nutrition[j] + '</span>';
  }
  var stageChips = '';
  for(var k=0;k<d.stages.length;k++){
    var st = d.stages[k];
    stageChips += '<span class="st ' + (st==='early'?'early':st==='late'?'late':'') + '">' + STAGE_NAME[st] + ' ' + STAGE_RANGE[st] + '</span>';
  }
  s.innerHTML =
    '<img class="sheet-hero" src="' + (d.img||'') + '" alt="' + d.name + '" />' +
    '<div class="sheet-title">' + d.name + '</div>' +
    '<div class="sheet-sub">' +
      '<span class="cuisine-chip">' + d.cuisine + '</span>' +
      '<span class="cat-chip">' + d.category + '</span>' +
      '<span class="cat-chip">' + d.method + '</span>' +
      '<span class="cat-chip">难度' + d.difficulty + '</span>' +
      '<span class="cat-chip">约' + d.time + '</span>' +
    '</div>' +
    '<div class="sheet-price-row"><span class="sheet-price">¥' + fmtPrice(d.price) + '</span><span class="sheet-sales">月售 ' + (d.sales>999?Math.round(d.sales/100)/10+'k':d.sales) + '</span></div>' +
    '<div class="sheet-tags">' + tagsHtml + '</div>' +
    '<div class="sheet-tags">' + stageChips + '</div>' +
    '<div class="sheet-sec"><h4>AI孕期分析</h4><div class="ai-box"><span class="ai-tag">🤰 营养师解读</span><br/>' + d.analysis + '</div></div>' +
    '<div class="sheet-sec"><h4>营养亮点</h4><div class="nutri-row">' + nutHtml + '</div></div>' +
    '<div class="sheet-sec"><h4>功效与作用</h4><div class="sheet-tips">' + d.effect + '</div></div>' +
    '<div class="sheet-sec"><h4>适合人群</h4><div class="sheet-tips">' + d.suitable + '</div></div>' +
    '<div class="sheet-sec"><h4>食用建议</h4><div class="sheet-tips">' + d.tips + '</div></div>' +
    '<div class="sheet-sec"><h4>菜品档案</h4><div class="info-grid">' +
      '<div class="ig"><div class="k">原料</div><div class="v">' + d.ingredients + '</div></div>' +
      '<div class="ig"><div class="k">份量</div><div class="v">' + d.serving + '</div></div>' +
      '<div class="ig"><div class="k">荤素</div><div class="v">' + d.veg_type + '</div></div>' +
      '<div class="ig"><div class="k">口味</div><div class="v">' + d.taste + '</div></div>' +
      '<div class="ig"><div class="k">热量</div><div class="v">约' + d.calories + ' kcal</div></div>' +
      '<div class="ig"><div class="k">菜系</div><div class="v">' + d.cuisine + '</div></div>' +
    '</div></div>';
  $('sbNum').textContent = state.cart[d.id] || 0;
  state.activeDish = d;
}
function openSheet(id){
  var d = dishById(id);
  if(!d) return;
  renderSheet(d);
  $('sheet').classList.add('show');
  $('sheetMask').classList.add('show');
}
function closeSheet(){
  $('sheet').classList.remove('show');
  $('sheetMask').classList.remove('show');
}

/* ================= 购物车操作 ================= */
function addToCart(id, qty){
  state.cart[id] = Math.max(0, (state.cart[id]||0) + qty);
  if(state.cart[id] === 0) delete state.cart[id];
  syncCartUI();
  renderList();
  if(state.activeDish && state.activeDish.id === id){
    $('sbNum').textContent = state.cart[id]||0;
    var btn = $('sheetAdd');
    btn.textContent = (state.cart[id]||0) > 0 ? '再来一份' : '加入购物车';
  }
}
function syncCartUI(){
  var cnt = cartCount();
  var total = cartTotal();
  $('cartBadge').textContent = cnt;
  $('cartBadge').classList.toggle('show', cnt>0);
  $('cartIco').classList.toggle('has-items', cnt>0);
  $('cartAmt').textContent = fmtPrice(total);
  var sub = $('cartSubmit');
  var enough = total >= MIN_ORDER;
  sub.classList.toggle('disabled', !enough);
  sub.classList.toggle('enough', enough);
  sub.textContent = enough ? '去结算' : '¥' + MIN_ORDER + '起送';
  var desc = $('cartDesc');
  if(cnt === 0){
    desc.innerHTML = '满 ¥' + MIN_ORDER + ' 起送 · 免配送费';
  } else if(!enough){
    desc.innerHTML = '还差 <span class="free">¥' + (MIN_ORDER-total).toFixed(0) + '</span> 起送 · 免配送费';
  } else {
    desc.innerHTML = '共 ' + cnt + ' 件 · 免配送费';
  }
  // 购物车页
  $('cfAmt').textContent = fmtPrice(total);
}
function renderCartPage(){
  var box = $('cartItems');
  var ids = Object.keys(state.cart);
  if(!ids.length){
    box.innerHTML = '<div style="padding:60px 20px;text-align:center;color:var(--ink-3);">🛒 购物车还是空的<br/><span style="font-size:12px;">去点几道喜欢的菜吧</span></div>';
    return;
  }
  var html = '';
  ids.forEach(function(id){
    var d = dishById(id);
    if(!d) return;
    var qty = state.cart[id];
    html += '<div class="cart-item">' +
      '<img class="ci-img" src="' + (d.img||'') + '" />' +
      '<div class="ci-info">' +
        '<div class="ci-name">' + d.name + '</div>' +
        '<div class="ci-meta">' + d.cuisine + ' · ' + d.category + '</div>' +
        '<div class="ci-price">¥' + fmtPrice(d.price) + ' × ' + qty + '</div>' +
      '</div>' +
      '<div class="stepper">' +
        '<button class="sb minus" data-act="minus" data-id="' + id + '">−</button>' +
        '<span class="num">' + qty + '</span>' +
        '<button class="sb plus" data-act="plus" data-id="' + id + '">＋</button>' +
      '</div>' +
    '</div>';
  });
  box.innerHTML = html;
}


/* ================= 下单 ================= */
function submitOrder(){
  var ids = Object.keys(state.cart);
  if(!ids.length){ toast('购物车是空的哦'); return; }
  var total = cartTotal();
  if(total < MIN_ORDER){ toast('还差 ¥' + (MIN_ORDER-total).toFixed(0) + ' 起送'); return; }
  var items = ids.map(function(id){
    var d = dishById(id);
    return {name:d.name, price:d.price, qty:state.cart[id]};
  });
  var payload = {
    msg_type: 'interactive',
    card: {
      config: {wide_screen_mode: true},
      header: {
        template: 'orange',
        title: {tag:'plain_text', content:'🍽️ 宝贝点菜 · 新订单'}
      },
      elements: [
        {tag:'div', text:{tag:'lark_md', content:'**下单人：**宝妈（孕' + state.week + '周 · ' + STAGE_NAME[currentStage()] + '）'}},
        {tag:'hr'},
        {tag:'div', text:{tag:'lark_md', content: items.map(function(it){
          return '**' + it.name + '**　×' + it.qty + '　¥' + (it.price*it.qty);
        }).join('\n')}},
        {tag:'hr'},
        {tag:'div', text:{tag:'lark_md', content:'**合计：**¥' + total + '　（' + items.length + ' 种菜）'}},
        {tag:'note', elements:[{tag:'plain_text', content:'来自「宝贝点菜」孕期点餐应用 · 免配送费'}]}
      ]
    }
  };
  var btn = $('cfSubmit');
  btn.disabled = true;
  btn.textContent = '提交中…';
  fetch(WEBHOOK_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  }).then(function(r){return r.json();}).then(function(res){
    var ok = res && (res.code === 0 || res.StatusCode === 0 || res.code === 200);
    btn.disabled = false;
    btn.textContent = '提交订单';
    if(ok){
      state.orders.unshift({
        time: new Date().toLocaleString('zh-CN',{hour12:false}),
        items: items, total: total,
        week: state.week, stage: STAGE_NAME[currentStage()]
      });
      if(state.orders.length > 30) state.orders.length = 30;
      saveOrders();
      var od = $('odList');
      od.innerHTML = items.map(function(it){
        return '<div class="li"><span>' + it.name + ' ×' + it.qty + '</span><span>¥' + (it.price*it.qty) + '</span></div>';
      }).join('') +
      '<div class="li" style="font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:6px;"><span>合计</span><span>¥' + total + '</span></div>';
      $('cartPage').classList.remove('show');
      $('orderDone').classList.add('show');
      state.cart = {};
      syncCartUI();
      renderList();
    } else {
      toast('下单失败：' + (res.msg || res.message || '未知错误'));
    }
  }).catch(function(err){
    btn.disabled = false;
    btn.textContent = '提交订单';
    toast('网络异常，请重试');
  });
}

/* ================= 订单历史 ================= */
function renderOrders(){
  var list = $('ordersList');
  if(!list) return;
  if(!state.orders.length){
    list.innerHTML = '<div style="padding:60px 20px;text-align:center;color:var(--ink-3);">📋 还没有订单<br/><span style="font-size:12px;">点菜下单后会显示在这里</span></div>';
    return;
  }
  var html = '';
  for(var i=0;i<state.orders.length;i++){
    var o = state.orders[i];
    html += '<div class="cart-item" style="flex-direction:column;align-items:flex-start;">' +
      '<div style="width:100%;display:flex;justify-content:space-between;align-items:center;">' +
        '<span style="font-size:12px;color:var(--ink-2);">' + o.time + '</span>' +
        '<span style="font-size:11px;color:var(--ink-3);">' + o.stage + ' · ' + o.week + '周</span>' +
      '</div>' +
      '<div style="width:100%;">' + o.items.map(function(it){
        return '<div class="li" style="display:flex;justify-content:space-between;padding:2px 0;font-size:12.5px;">' +
          '<span>' + it.name + ' ×' + it.qty + '</span><span>¥' + (it.price*it.qty) + '</span></div>';
      }).join('') + '</div>' +
      '<div style="width:100%;border-top:1px solid var(--line);padding-top:4px;display:flex;justify-content:space-between;font-weight:700;">' +
        '<span>合计</span><span style="color:var(--primary);">¥' + o.total + '</span></div>' +
    '</div>';
  }
  list.innerHTML = html;
}

/* ================= Tab 切换 ================= */
function switchTab(tab){
  var tabs = document.querySelectorAll('.tab-item');
  for(var i=0;i<tabs.length;i++){
    tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === tab);
  }
  var main = document.querySelector('.main');
  var topbar = document.querySelector('.topbar');
  var cartBar = $('cartBar');
  var tabBar = $('tabBar');
  if(tab === 'menu'){
    main.style.display = 'flex';
    topbar.style.display = 'block';
    cartBar.style.display = 'block';
  } else if(tab === 'guide'){
    main.style.display = 'none';
    topbar.style.display = 'none';
    cartBar.style.display = 'none';
    if(!$('guidePage')){
      var gp = document.createElement('div');
      gp.id = 'guidePage';
      gp.innerHTML = renderGuide();
      gp.style.cssText = 'flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;';
      $('app').insertBefore(gp, tabBar);
    }
    $('guidePage').style.display = 'block';
  } else if(tab === 'orders'){
    main.style.display = 'none';
    topbar.style.display = 'none';
    cartBar.style.display = 'none';
    if(!$('ordersPage')){
      var op = document.createElement('div');
      op.id = 'ordersPage';
      op.style.cssText = 'flex:1;overflow-y:auto;padding:16px 16px 80px;-webkit-overflow-scrolling:touch;';
      op.innerHTML = '<div class="group-title">📋 我的订单</div><div id="ordersList"></div>';
      $('app').insertBefore(op, tabBar);
    }
    $('ordersPage').style.display = 'block';
    renderOrders();
  }
}

/* ================= 孕期指南页 ================= */
function renderGuide(){
  var cs = currentStage();
  var html = '<div class="group-title">📖 孕期饮食指南</div>';
  html += '<div style="background:var(--surface);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);">' +
    '<div style="font-size:15px;font-weight:700;margin-bottom:6px;">当前阶段：' + STAGE_NAME[cs] + '（' + STAGE_RANGE[cs] + '）</div>' +
    '<div style="font-size:12.5px;color:var(--ink-2);line-height:1.7;">本应用已自动过滤不适合当前阶段的菜品，放心点菜～</div></div>';
  var guides = {
    early: ['孕早期（≤12周）',
      '· 补充叶酸：深绿色蔬菜、豆类、全谷物\n· 缓解孕吐：少食多餐、清淡易消化、避免油腻辛辣\n· 优质蛋白：鸡蛋、鱼肉、瘦肉、豆腐\n· 汤羹粥类温和养胃，胃口不佳时首选\n· 避免生食刺身、未全熟蛋、活血类药材汤'],
    mid: ['孕中期（13-27周）',
      '· 补铁补钙：红肉、猪肝(每周≤2次)、牛奶、豆制品\n· 补DHA：深海鱼（三文鱼、鳕鱼）每周2-3次\n· 热量需求上升，注意优质碳水+蛋白质搭配\n· 控制糖分：甜品糖水适量，警惕妊娠期血糖\n· 少盐少油，预防水肿与妊娠期高血压'],
    late: ['孕晚期（28周+）',
      '· 高纤维防便秘：蔬菜、粗粮、火龙果\n· 补钙冲刺：牛奶、虾皮、芝麻\n· 少食多餐：胃部受压，一次不宜过饱\n· 控制体重：减少高糖高脂，主食适量\n· 临产储备：保证蛋白质摄入，随时待产']
  };
  var g = guides[cs];
  html += '<div style="background:var(--surface);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);">' +
    '<div style="font-size:14px;font-weight:700;margin-bottom:8px;">🥗 ' + g[0] + '</div>' +
    '<div style="font-size:12.5px;color:var(--ink);line-height:1.9;white-space:pre-line;">' + g[1] + '</div></div>';
  html += '<div style="background:var(--surface);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);">' +
    '<div style="font-size:14px;font-weight:700;margin-bottom:8px;">⚠️ 孕期饮食红线</div>' +
    '<div style="font-size:12.5px;color:var(--ink);line-height:1.9;white-space:pre-line;">· 生食/半生食：刺身、生蚝、溏心蛋\n· 活血化瘀类：甲鱼、螃蟹、薏米、藏红花\n· 高汞鱼类：金枪鱼、鲨鱼、剑鱼\n· 酒精及含酒精甜品\n· 过量咖啡因（每日咖啡≤1杯）\n· 未消毒乳制品</div></div>';
  html += '<div style="background:var(--surface);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);">' +
    '<div style="font-size:14px;font-weight:700;margin-bottom:8px;">🍚 本周营养重点</div>' +
    '<div style="font-size:12.5px;color:var(--ink);line-height:1.9;">根据孕周自动推荐，点开每道菜可看「AI孕期分析」～</div></div>';
  return html;
}


/* ================= 孕周设置 ================= */
function renderWeekSheet(){
  var sel = $('weekSelect');
  var html = '';
  for(var w=1;w<=42;w++){
    var st = stageOfWeek(w);
    html += '<option value="' + w + '"' + (w===state.week?' selected':'') + '>孕' + w + '周（' + STAGE_NAME[st] + '）</option>';
  }
  sel.innerHTML = html;
  $('stageSelect').value = state.stageMode;
}
function updateWeekPill(){
  var cs = currentStage();
  $('weekPill').textContent = STAGE_NAME[cs] + ' ' + state.week + '周';
  $('weekPill').style.background = cs==='early' ? 'var(--gold-soft)' : (cs==='mid' ? 'var(--green-soft)' : '#EDE9FE');
  $('weekPill').style.color = cs==='early' ? 'var(--gold)' : (cs==='mid' ? 'var(--green)' : '#7C3AED');
  $('weekPill').style.borderColor = cs==='early' ? '#FDE8C8' : (cs==='mid' ? '#C8F0D5' : '#DCD0FB');
}

/* ================= 事件绑定 ================= */
function bindEvents(){
  // 导航点击
  $('cuisineNav').addEventListener('click', function(e){
    var item = e.target.closest('.nav-item');
    if(!item) return;
    state.activeNav = item.getAttribute('data-nav');
    renderNav();
    renderList();
  });
  // 菜品点击（打开详情）
  $('dishList').addEventListener('click', function(e){
    var addBtn = e.target.closest('[data-act="add"]');
    if(addBtn){
      e.stopPropagation();
      addToCart(addBtn.getAttribute('data-id'), 1);
      toast('已加入购物车');
      return;
    }
    var item = e.target.closest('.dish-item');
    if(item) openSheet(item.getAttribute('data-id'));
  });
  // 搜索
  $('searchInput').addEventListener('input', function(){ renderList(); });
  // 详情弹层
  $('sheetMask').addEventListener('click', closeSheet);
  $('sbMinus').addEventListener('click', function(){
    if(state.activeDish) addToCart(state.activeDish.id, -1);
  });
  $('sbPlus').addEventListener('click', function(){
    if(state.activeDish) addToCart(state.activeDish.id, 1);
  });
  $('sheetAdd').addEventListener('click', function(){
    if(state.activeDish) addToCart(state.activeDish.id, 1);
  });
  // 购物车栏
  $('cartIco').addEventListener('click', function(){
    if(!cartCount()){ toast('购物车是空的哦'); return; }
    renderCartPage();
    $('cartPage').classList.add('show');
  });
  $('cartBar').addEventListener('click', function(e){
    var sub = e.target.closest('#cartSubmit');
    if(sub){
      if(cartTotal() < MIN_ORDER){ toast('还差 ¥' + (MIN_ORDER-cartTotal()).toFixed(0) + ' 起送'); return; }
      renderCartPage();
      $('cartPage').classList.add('show');
    }
  });
  // 购物车页
  $('cartBack').addEventListener('click', function(){ $('cartPage').classList.remove('show'); });
  $('cartClear').addEventListener('click', function(){
    state.cart = {};
    syncCartUI();
    renderCartPage();
    renderList();
    toast('购物车已清空');
  });
  $('cartItems').addEventListener('click', function(e){
    var btn = e.target.closest('[data-act]');
    if(!btn) return;
    var id = btn.getAttribute('data-id');
    var act = btn.getAttribute('data-act');
    addToCart(id, act==='plus'?1:-1);
    renderCartPage();
  });
  $('cfSubmit').addEventListener('click', submitOrder);
  // 下单成功返回
  $('odBack').addEventListener('click', function(){
    $('orderDone').classList.remove('show');
    switchTab('menu');
    renderList();
  });
  // Tab
  $('tabBar').addEventListener('click', function(e){
    var item = e.target.closest('.tab-item');
    if(item) switchTab(item.getAttribute('data-tab'));
  });
  // 孕周
  $('weekPill').addEventListener('click', function(){
    renderWeekSheet();
    $('weekSheet').classList.add('show');
    $('weekMask').classList.add('show');
  });
  $('weekMask').addEventListener('click', function(){
    $('weekSheet').classList.remove('show');
    $('weekMask').classList.remove('show');
  });
  $('weekSave').addEventListener('click', function(){
    state.week = parseInt($('weekSelect').value, 10);
    state.stageMode = $('stageSelect').value;
    updateWeekPill();
    renderNav();
    renderList();
    $('weekSheet').classList.remove('show');
    $('weekMask').classList.remove('show');
    try{localStorage.setItem('bbdc_week', state.week); localStorage.setItem('bbdc_stage', state.stageMode);}catch(e){}
    toast('已切换至' + STAGE_NAME[currentStage()] + '（' + state.week + '周）');
  });
  // 引导浮层
  $('tutBtn').addEventListener('click', function(){
    $('tutorial').classList.remove('show');
  });
}

/* ================= 初始化 ================= */
(function init(){
  try{
    var w = parseInt(localStorage.getItem('bbdc_week'),10);
    if(w && w>=1 && w<=42) state.week = w;
    var sm = localStorage.getItem('bbdc_stage');
    if(sm === 'early' || sm === 'mid' || sm === 'late' || sm === 'auto') state.stageMode = sm;
  }catch(e){}
  updateWeekPill();
  renderNav();
  renderList();
  syncCartUI();
  bindEvents();
  // 首次使用显示引导
  try{
    if(!localStorage.getItem('bbdc_seen')){
      $('tutorial').classList.add('show');
      localStorage.setItem('bbdc_seen','1');
    }
  }catch(e){}
})();
</script>
</body>
</html>
