  <style>
    :root {
      --bg: #F4F3EC;
      --surface: #FFFFFF;
      --surface-2: #FAF9F3;
      --ink: #22302A;
      --ink-2: #5E6B62;
      --ink-3: #97A29A;
      --line: #E4E2D6;
      --line-soft: #EFEDE3;
      --green: #2F5545;
      --green-2: #4A7563;
      --green-soft: #E6EEE8;
      --coral: #E4674F;
      --coral-soft: #FBE7E0;
      --gold: #D9A441;
      --gold-soft: #F8EDD5;
      --red: #C0504A;
      --red-soft: #F8E3E0;
      --shadow-1: 0 1px 2px rgba(34, 48, 42, 0.05);
      --shadow-2: 0 6px 20px -8px rgba(34, 48, 42, 0.22);
      --shadow-3: 0 18px 48px -16px rgba(34, 48, 42, 0.4);
      --r-s: 10px;
      --r-m: 14px;
      --r-l: 20px;
      --r-xl: 26px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; width: 100%; overflow: hidden; }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-wrap: pretty;
    }

    #root {
      height: 100%; width: 100%;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(1200px 600px at 20% -10%, #E9EFE4 0%, transparent 60%),
        radial-gradient(900px 500px at 100% 100%, #F7E7DE 0%, transparent 55%),
        #EDEBE2;
    }

    .app {
      width: 100%; max-width: 430px; height: 100%; max-height: 920px;
      background: var(--bg);
      position: relative; overflow: hidden;
      display: flex; flex-direction: column;
      box-shadow: 0 30px 80px -30px rgba(34, 48, 42, 0.45);
    }
    @media (min-width: 520px) {
      .app { border-radius: 30px; height: calc(100% - 44px); }
    }

    ::-webkit-scrollbar { width: 0; height: 0; }
    .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .hscroll { overflow-x: auto; display: flex; }
    .hscroll::-webkit-scrollbar { display: none; }

    .serif { font-family: 'Noto Serif SC', Georgia, serif; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

    /* header */
    .hdr {
      background: var(--green);
      color: #F3F1E6;
      padding: 14px 20px 18px;
      position: relative;
      flex-shrink: 0;
    }
    .hdr::after {
      content: '';
      position: absolute; inset: auto 0 0 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(243,241,230,.25), transparent);
    }
    .hdr-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .eyebrow {
      font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
      color: rgba(243, 241, 230, .55); font-weight: 500;
    }
    .hdr-name { font-size: 21px; line-height: 1.25; font-weight: 600; margin-top: 3px; }
    .hdr-sub { font-size: 12px; color: rgba(243, 241, 230, .68); margin-top: 3px; }

    .icon-btn {
      width: 36px; height: 36px; border-radius: 11px;
      border: 1px solid rgba(243,241,230,.22);
      background: rgba(243,241,230,.08);
      color: #F3F1E6; display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; transition: background .18s;
    }
    .icon-btn:active { background: rgba(243,241,230,.2); }

    /* week strip */
    .week { display: flex; gap: 7px; margin-top: 16px; }
    .wd {
      flex: 1; border: none; cursor: pointer; padding: 7px 0 8px;
      border-radius: 12px; background: rgba(243,241,230,.07);
      color: rgba(243,241,230,.7); display: flex; flex-direction: column;
      align-items: center; gap: 1px; transition: all .18s;
    }
    .wd span:first-child { font-size: 10px; letter-spacing: .04em; }
    .wd span:last-child { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .wd.on { background: #F3F1E6; color: var(--green); }
    .wd.today span:first-child { color: var(--gold); }
    .wd.on.today span:first-child { color: var(--coral); }

    /* nav */
    .nav {
      display: flex; background: var(--surface);
      border-top: 1px solid var(--line); flex-shrink: 0;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      flex: 1; border: none; background: none; cursor: pointer;
      padding: 9px 0 11px; display: flex; flex-direction: column;
      align-items: center; gap: 3px; color: var(--ink-3);
      font-size: 10.5px; font-family: inherit; position: relative;
      transition: color .18s;
    }
    .nav-item.on { color: var(--green); font-weight: 600; }
    .nav-item.on::before {
      content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 22px; height: 2px; border-radius: 0 0 2px 2px; background: var(--coral);
    }
    .nav-badge {
      position: absolute; top: 4px; right: calc(50% - 22px);
      min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
      background: var(--coral); color: #fff; font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }

    /* generic */
    .card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r-m); box-shadow: var(--shadow-1);
    }
    .sec-title {
      font-size: 12px; font-weight: 600; letter-spacing: .1em;
      text-transform: uppercase; color: var(--ink-3);
      display: flex; align-items: center; gap: 8px;
    }
    .sec-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }

    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10.5px; font-weight: 500; padding: 2px 7px;
      border-radius: 6px; background: var(--surface-2);
      color: var(--ink-2); border: 1px solid var(--line-soft);
      white-space: nowrap;
    }
    .chip.green { background: var(--green-soft); color: var(--green); border-color: transparent; }
    .chip.coral { background: var(--coral-soft); color: #B44B36; border-color: transparent; }
    .chip.gold  { background: var(--gold-soft); color: #8A6516; border-color: transparent; }

    .btn {
      border: none; cursor: pointer; font-family: inherit; font-weight: 600;
      border-radius: 13px; transition: transform .12s, filter .18s;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    }
    .btn:active { transform: scale(.985); }
    .btn-primary { background: var(--coral); color: #fff; padding: 14px; font-size: 15px; box-shadow: 0 6px 18px -8px rgba(228,103,79,.8); }
    .btn-dark { background: var(--green); color: #F3F1E6; padding: 13px; font-size: 14px; }
    .btn-ghost { background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); padding: 10px 14px; font-size: 13px; font-weight: 500; }
    .btn:disabled { opacity: .45; pointer-events: none; }

    /* sheet */
    .sheet-mask {
      position: absolute; inset: 0; z-index: 90;
      background: rgba(28, 38, 33, .42);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      display: flex; align-items: flex-end;
      animation: maskIn .22s ease-out;
    }
    .sheet {
      width: 100%; background: var(--bg);
      border-radius: 24px 24px 0 0; max-height: 88%;
      display: flex; flex-direction: column;
      animation: sheetUp .34s cubic-bezier(.16,1,.3,1);
      box-shadow: var(--shadow-3);
    }
    .sheet-grab {
      width: 38px; height: 4px; border-radius: 2px; background: var(--line);
      margin: 10px auto 2px; flex-shrink: 0;
    }
    .sheet-body { padding: 14px 22px 26px; overflow-y: auto; }

    .toast {
      position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%);
      background: var(--ink); color: #F3F1E6; font-size: 13px; font-weight: 500;
      padding: 10px 18px; border-radius: 22px; z-index: 200;
      box-shadow: var(--shadow-2); display: flex; align-items: center; gap: 8px;
      animation: toastIn .28s cubic-bezier(.16,1,.3,1); white-space: nowrap;
      max-width: 88%;
    }

    .push {
      position: absolute; top: 10px; left: 10px; right: 10px; z-index: 210;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-radius: 18px; padding: 12px 14px;
      box-shadow: 0 14px 40px -12px rgba(34,48,42,.5);
      display: flex; gap: 11px; align-items: flex-start;
      animation: pushIn .45s cubic-bezier(.16,1,.3,1);
      cursor: pointer;
    }
    .push-icon {
      width: 36px; height: 36px; border-radius: 10px; background: #1AAD19;
      display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0;
    }

    @keyframes maskIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes sheetUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px) } to { opacity: 1; transform: translate(-50%, 0) } }
    @keyframes pushIn { from { opacity: 0; transform: translateY(-24px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(9px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes pop { 0% { transform: scale(.9); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }

    .fade-up { animation: fadeUp .34s cubic-bezier(.16,1,.3,1) both; }
    .pop { animation: pop .22s ease-out both; }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .001s !important; transition-duration: .001s !important; }
    }
  </style>
